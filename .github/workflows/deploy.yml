name: Daily Data Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * 3-11 1-5'  # 7 AM ET (DST)
    - cron: '0 19 * 3-11 1-5'  # 3 PM ET (DST)
    - cron: '0 12 * 1,2,12 1-5'  # 7 AM ET (Standard)
    - cron: '0 20 * 1,2,12 1-5'  # 3 PM ET (Standard)
  workflow_dispatch:

jobs:
  download:
    name: Download Data from Dropbox
    runs-on: ubuntu-latest
    outputs:
      new_data: ${{ steps.fetch.outputs.new_data }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Python + Dropbox SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install dropbox

      - name: Run Python download script
        id: fetch  
        env: 
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python pythondropbox.py

      # --- NEW: Visual confirmation when the workflow aborts ---
      - name: Report no new data
        if: steps.fetch.outputs.new_data == 'false'
        run: |
          echo "No new files were found in Dropbox."
          echo "### Pipeline Aborted 🛑" >> $GITHUB_STEP_SUMMARY
          echo "The newest file on Dropbox is already in the repository. The workflow will stop here to save compute time." >> $GITHUB_STEP_SUMMARY

      - name: Commit and push downloaded data
        if: steps.fetch.outputs.new_data == 'true'  
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tracker/data/
          
          git diff --cached --quiet && exit 0
          git commit -m "Downloaded latest data from Dropbox"
          git push origin main

  process_data:
    name: Process R Data
    needs: download
    if: needs.download.outputs.new_data == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
                                  libpng-dev libjpeg-dev libfreetype6-dev

      - name: Install minimal R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","tidyr","here"), repos="https://cloud.r-project.org")'

      - name: Run R data processing
        run: Rscript data_processing.R

      - name: Commit and push processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tracker/data/

          git diff --cached --quiet && exit 0
          git commit -m "Processed daily R data $(date -u +'%Y-%m-%d')"
          
          git pull --rebase origin main
          git push origin HEAD:main