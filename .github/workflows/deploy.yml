name: Daily Data Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * 3-11 1-5'  # 7 AM ET (DST)
    - cron: '0 19 * 3-11 1-5'  # 3 PM ET (DST)
    - cron: '0 12 * 1,2,12 1-5'  # 7 AM ET (Standard)
    - cron: '0 20 * 1,2,12 1-5'  # 3 PM ET (Standard)
  workflow_dispatch:

jobs:
  run_pipeline:
    name: Fetch and Process Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --- 1. SET UP EVERYTHING ---
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev libfreetype6-dev
          pip3 install dropbox

      # --- 2. CHECK FOR NEW DATA ---
      - name: Run Python download script
        id: fetch  
        env: 
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python pythondropbox.py

      - name: Report no new data
        if: steps.fetch.outputs.new_data == 'false'
        run: |
          echo "### Pipeline Aborted 🛑" >> $GITHUB_STEP_SUMMARY
          echo "The newest file on Dropbox is already in the repository. The workflow will stop here to save compute time." >> $GITHUB_STEP_SUMMARY

      # --- 3. PROCESS DATA (Only runs if new data was found) ---
      - name: Install R packages
        if: steps.fetch.outputs.new_data == 'true'
        run: Rscript -e 'install.packages(c("dplyr","tidyr","here"), repos="https://cloud.r-project.org")'

      - name: Run R data processing
        if: steps.fetch.outputs.new_data == 'true'
        run: Rscript data_processing.R

      # --- 4. COMMIT EVERYTHING AT ONCE (Only runs if R script succeeded) ---
      - name: Commit and push all data
        if: steps.fetch.outputs.new_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tracker/data/
          
          git diff --cached --quiet && exit 0
          git commit -m "Processed new Dropbox data $(date -u +'%Y-%m-%d')"
          git push origin main