name: Daily Data Pipeline and Shiny Deployment

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * 3-11 1-5'  # 7 AM ET (DST)
    - cron: '0 19 * 3-11 1-5'  # 3 PM ET (DST)
    - cron: '0 12 * 1,2,12 1-5'  # 7 AM ET (Standard)
    - cron: '0 20 * 1,2,12 1-5'  # 3 PM ET (Standard)
  workflow_dispatch:

jobs:
  download:
    name: Download Data from Dropbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Python + Dropbox SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install dropbox

      - name: Run Python download script
        run: python pythondropbox.py

      - name: Commit and push downloaded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # This line now adds EVERYTHING in the tracker/data folder
          git add tracker/data/
          
          git diff --cached --quiet && exit 0
          git commit -m "Downloaded latest data from Dropbox"
          git push origin main

  process_data:
    name: Process R Data
    needs: download
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
                                  libpng-dev libjpeg-dev libfreetype6-dev

      - name: Install minimal R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","tidyr","here"), repos="https://cloud.r-project.org")'

      - name: Run R data processing
        run: Rscript data_processing.R

      - name: Commit and push processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          #  use this to just add everything in tracker/data regardless of extension:
          git add tracker/data/

          git diff --cached --quiet && exit 0
          git commit -m "Processed daily R data $(date -u +'%Y-%m-%d')"
          
          git pull --rebase origin main
          git push origin HEAD:main

  deploy_shiny:
    name: Deploy Shiny App
    needs: process_data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main  # Forces checkout of the latest commit on main, including the new RDS files

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
                                  libpng-dev libjpeg-dev libfreetype6-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages('remotes', repos='https://cloud.r-project.org')"
          Rscript -e "remotes::install_cran(c('curl','scales','shiny','dplyr','ggplot2','tidyr','lubridate','rsconnect','viridis','bslib'), dependencies=TRUE)"

      - name: Strip binary suffixes from package versions
        run: |
          Rscript -e '
            for (pkg in list.dirs(.libPaths()[1], recursive = FALSE)) {
              dcf <- file.path(pkg, "DESCRIPTION")
              if (file.exists(dcf)) {
                desc <- read.dcf(dcf)
                if (grepl("-", desc[1, "Version"])) {
                  desc[1, "Version"] <- gsub("-.*", "", desc[1, "Version"])
                  write.dcf(desc, file = dcf)
                }
              }
            }'

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "rsconnect::setAccountInfo(name='${SHINYAPPS_NAME}', token='${SHINYAPPS_TOKEN}', secret='${SHINYAPPS_SECRET}')"
          Rscript -e "rsconnect::deployApp(appDir='tracker', appName='nwri-tracker', forceUpdate=TRUE)"
